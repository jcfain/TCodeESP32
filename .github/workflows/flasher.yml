name: flasher

on:
  push:
    branches: [master, MillibytePlatforms]
    paths:
      - "ESP32/flasher/python/**"
      - "ESP32/platformio.ini"
      - ".github/workflows/flasher.yml"
  pull_request:
    paths:
      - "ESP32/flasher/python/**"
      - ".github/workflows/flasher.yml"
  workflow_dispatch:
  release:
    types: [published]

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: TCodeFlasher-linux-x86_64
          - os: windows-latest
            artifact: TCodeFlasher-windows-x86_64
          - os: macos-latest
            artifact: TCodeFlasher-macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install platformio
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Install build toolchain (warm pio cache)
        working-directory: ESP32
        # Force pio to materialise every package referenced by the env so
        # the toolchain/esptool bins are guaranteed on disk before the build
        # spawns subprocesses (Windows runners otherwise drop them from PATH).
        run: |
          pio pkg install -e sr6_pcb

      - name: Add pio toolchain to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $base = "$env:USERPROFILE\.platformio\packages"
          # Add toolchain xtensa bin (xtensa-esp32s3-elf-g++.exe)
          $tc = Get-ChildItem -Path "$base" -Directory -Filter "toolchain-xtensa-esp-elf*" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($tc) {
            $bin = Join-Path $tc.FullName "bin"
            if (Test-Path $bin) { Add-Content -Path $env:GITHUB_PATH -Value $bin; "Added $bin" }
          }
          # Each tool-* package's root is the bin dir for the tool exe
          # (mklittlefs, esptool, xtensa-esp-elf-gdb, etc.).
          Get-ChildItem -Path "$base" -Directory -Filter "tool-*" -ErrorAction SilentlyContinue | ForEach-Object {
            Add-Content -Path $env:GITHUB_PATH -Value $_.FullName
            "Added $($_.FullName)"
          }
          # Make sure pio penv Scripts wins for pioarduino's Python helpers.
          $penv = "$env:USERPROFILE\.platformio\penv\Scripts"
          if (Test-Path $penv) { Add-Content -Path $env:GITHUB_PATH -Value $penv; "Added $penv" }

      - name: Pre-install esptool from PyPI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # pioarduino tries to "uv pip install -e tool-esptoolpy" but that
          # package isn't a Python project. Drop a minimal pyproject.toml into
          # the package dir so uv can install it as an editable package.
          pip install --upgrade "esptool>=4.7"
          $pkg = "$env:USERPROFILE\.platformio\packages\tool-esptoolpy"
          if (Test-Path $pkg) {
            $pyproject = Join-Path $pkg "pyproject.toml"
            $setuppy  = Join-Path $pkg "setup.py"
            if (-not (Test-Path $pyproject) -and -not (Test-Path $setuppy)) {
              $shim = "[build-system]`nrequires = [`"setuptools>=61`"]`nbuild-backend = `"setuptools.build_meta`"`n`n[project]`nname = `"tool-esptoolpy-shim`"`nversion = `"0.0.0`"`n"
              Set-Content -Encoding utf8 -Path $pyproject -Value $shim
              "Wrote shim $pyproject"
            }
          }

      - name: Build firmware + filesystem (sr6_pcb)
        working-directory: ESP32
        shell: bash
        run: |
          mkdir -p cache
          # IMPORTANT: build the filesystem FIRST. pioarduino's `-t buildfs`
          # cleans the env's build dir, which would otherwise destroy the
          # firmware/bootloader bins we need.
          pio run -t buildfs -e sr6_pcb
          pio run -e sr6_pcb
          echo "--- .pio/build/sr6_pcb/ contents ---"
          ls -la .pio/build/sr6_pcb/ || true

      - name: Stage firmware bundle (sr6_pcb)
        working-directory: ESP32
        run: |
          dest=flasher/python/firmware/sr6_pcb
          mkdir -p "$dest"
          # Bootloader / partitions: prefer the build-output copies, fall back
          # to anything pioarduino staged in framework-arduinoespressif32-libs.
          find_first() {
            local name="$1"
            shift
            for p in "$@"; do
              if [ -f "$p" ]; then echo "$p"; return 0; fi
            done
            # Last-ditch glob through the toolchain.
            find ~/.platformio/packages -type f -name "$name" 2>/dev/null | head -n1
          }
          bl=$(find_first bootloader.bin .pio/build/sr6_pcb/bootloader.bin)
          pt=$(find_first partitions.bin .pio/build/sr6_pcb/partitions.bin)
          [ -n "$bl" ] && cp "$bl" "$dest/bootloader.bin" || { echo "::error::no bootloader.bin"; exit 1; }
          [ -n "$pt" ] && cp "$pt" "$dest/partitions.bin" || { echo "::error::no partitions.bin"; exit 1; }
          cp .pio/build/sr6_pcb/firmware.bin "$dest/"
          if [ -f .pio/build/sr6_pcb/littlefs.bin ]; then
            cp .pio/build/sr6_pcb/littlefs.bin "$dest/"
          elif [ -f .pio/build/sr6_pcb/spiffs.bin ]; then
            cp .pio/build/sr6_pcb/spiffs.bin "$dest/littlefs.bin"
          fi
          cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin "$dest/" || true
          ls -la "$dest"

      - name: Install flasher dev deps
        working-directory: ESP32/flasher/python
        run: |
          pip install -e .[dev]

      - name: Build executable
        working-directory: ESP32/flasher/python
        run: |
          pyinstaller flasher.spec
          ls -la dist/

      - name: Package (Windows)
        if: runner.os == 'Windows'
        working-directory: ESP32/flasher/python/dist
        run: |
          mv TCodeFlasher.exe "${{ matrix.artifact }}.exe"
          7z a "${{ matrix.artifact }}.zip" "${{ matrix.artifact }}.exe"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        working-directory: ESP32/flasher/python/dist
        run: |
          mv TCodeFlasher "${{ matrix.artifact }}"
          chmod +x "${{ matrix.artifact }}"
          # tar preserves the +x bit; GitHub artifacts otherwise drop it.
          tar -czvf "${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        working-directory: ESP32/flasher/python/dist
        run: |
          # Prefer the .app bundle (one-click launchable from Finder).
          if [ -d "TCodeFlasher.app" ]; then
            chmod +x "TCodeFlasher.app/Contents/MacOS/TCodeFlasher" || true
            # ditto preserves resource forks/extended attrs that zip would lose,
            # which keeps Gatekeeper happy when the user right-click → Opens.
            ditto -c -k --sequesterRsrc --keepParent \
              "TCodeFlasher.app" "${{ matrix.artifact }}.zip"
          else
            mv TCodeFlasher "${{ matrix.artifact }}"
            chmod +x "${{ matrix.artifact }}"
            zip -9 "${{ matrix.artifact }}.zip" "${{ matrix.artifact }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ESP32/flasher/python/dist/${{ matrix.artifact }}.zip
            ESP32/flasher/python/dist/${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  release:
    name: attach to release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten download tree
        run: |
          mkdir -p release
          find dist -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} release/ \;
          ls -la release/
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
