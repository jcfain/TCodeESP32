; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Set a path to a cache folder
build_cache_dir = ./cache
boards_dir = ./boards
include_dir = ./

[com-ports]
monitor_speed = 115200
upload_speed = 921600
monitor_rts = 0
monitor_dtr = 0

[common]
lib_deps =
	ArduinoJson@7.4.2
	Arduino
	hacker-cb/MPark-Variant @ 1.4.0
	https://github.com/multiaxis/TCode-Library#a5ec926
	https://github.com/jcfain/LTC2944-Arduino-Library.git
	dfrobot/DFRobot_DF2301Q@^1.0.0
build_flags =
	-I src
	-I src/BLE
	-I src/HTTP
	-I src/logging
	-I src/Motion
	-I src/TCode
	-I src/TCode/v0.3
	-I src/TCode/v0.4
	-I lib
	-I lib/cfg
	-I lib/Ext
	-I lib/struct
lib_compat_mode = strict
lib_ldf_mode = chain ;to evaluate C/C++ Preprocessor conditional syntax for different builds. Keeps from compiling uneeded libraries.
board_build.filesystem = littlefs

[common:temperature]
lib_deps =
	https://github.com/PaulStoffregen/OneWire.git#v2.3.8
	milesburton/DallasTemperature@4.0.4
	Adafruit BusIO@1.17.2

[common:display]
lib_deps =
	adafruit/Adafruit SSD1306@2.5.15

[common:bldc]
lib_deps =
	askuric/Simple FOC@2.3.5
	simplefoc/SimpleFOCDrivers@1.0.9

[common:ESP32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30-2/platform-espressif32.zip
framework = arduino
extends = common, com-ports
lib_deps =
	${common.lib_deps}
build_flags =
	${common.build_flags}
monitor_filters = esp32_exception_decoder

[common:ESP8266]
platform = espressif8266@4.2.0
extends = common
lib_deps = ${common.lib_deps}
build_unflags = -Werror=unused-const-variable
build_flags = ${common.build_flags}
				-D ESP8266
framework = arduino
monitor_filters = esp8266_exception_decoder
					send_on_enter
					colorize

[common:ESP32-wifi]
lib_deps =
	${common:ESP32.lib_deps}
	ESP32Async/AsyncTCP@3.4.7
	ESP32Async/ESPAsyncWebServer@3.8.0
extra_scripts =
	pre:scripts/patch_asyncwebserver_chunk.py
build_flags = ${common:ESP32.build_flags} -D CONFIG_ASYNC_TCP_QUEUE_SIZE=32 -D CONFIG_ASYNC_TCP_STACK_SIZE=12288 -D CONFIG_ASYNC_TCP_RUNNING_CORE=1

[common:ESP32-ble]
lib_deps =
	${common:ESP32.lib_deps}
	h2zero/NimBLE-Arduino@2.3.4
build_flags = -D NIMBLE_LATEST

; Backward-compatible alias used by non-S3 environments.
[common:ESP32-bluetooth]
lib_deps =
	${common:ESP32-ble.lib_deps}
build_flags = ${common:ESP32-ble.build_flags}

[common:ESP8266-wifi]
extends = common:ESP8266
lib_deps =
	${common:ESP8266.lib_deps}
	ESP Async WebServer@1.2.4
build_flags = ${common:ESP8266.build_flags}

#Common build
[env:esp32doit-devkit-v1]
extends = common:ESP32, common:ESP32-wifi
board = esp32doit-devkit-v1
build_type = release
board_build.partitions = huge_app.csv
build_flags = -D WROOM32_MODULE
			${common:ESP32-wifi.build_flags}
			${common:ESP32-bluetooth.build_flags}
		-D DEBUG_BUILD=0 -D BUILD_TEMP=1 -D BUILD_DISPLAY=1 -D BLUETOOTH_TCODE=0 -D BLE_TCODE=1 -D WIFI_TCODE=1 -D MOTOR_TYPE=0 -D SECURE_WEB=0 -D COEXIST=1 -D DEFAULT_DEVICE=DeviceType::OSR -D DEFAULT_BOARD=BoardType::DEVKIT #-D CORE_DEBUG_LEVEL=5 #-D FW_VERSION=%%date%%
lib_deps = ${common:ESP32.lib_deps}
			${common:ESP32-wifi.lib_deps}
			${common:display.lib_deps}
			${common:temperature.lib_deps}
			${common:ESP32-bluetooth.lib_deps}

[env:esp32doit-devkit-v1-bldc]
extends = env:esp32doit-devkit-v1
build_unflags = -D MOTOR_TYPE=0
build_flags = ${env:esp32doit-devkit-v1.build_flags}
			-D MOTOR_TYPE=1 -D DEFAULT_DEVICE=DeviceType::SSR1 -D DEFAULT_BOARD=BoardType::DEVKIT
lib_deps = ${env:esp32doit-devkit-v1.lib_deps}
			${common:bldc.lib_deps}
lib_archive = false #required for SimpleFOC

[env:esp32doit-devkit-v1-debug]
extends = env:esp32doit-devkit-v1
build_unflags = -D DEBUG_BUILD=0 ;-Os
build_flags = ${env:esp32doit-devkit-v1.build_flags}
		-D DEBUG_BUILD=1 -DCORE_DEBUG_LEVEL=5
build_type = debug

[env:esp32doit-devkit-v1-bldc-debug]
extends = env:esp32doit-devkit-v1-bldc
build_unflags = ${env:esp32doit-devkit-v1-bldc.build_unflags} -D DEBUG_BUILD=0
build_flags = ${env:esp32doit-devkit-v1-bldc.build_flags}
		-D DEBUG_BUILD=1 -DCORE_DEBUG_LEVEL=5
build_type = debug


; extends = env:esp32doit-devkit-v1
; build_unflags = -D DEBUG_BUILD=0 -D MOTOR_TYPE_SERVO
; build_flags = ${env:esp32doit-devkit-v1.build_flags}
; 			-D MOTOR_TYPE_BLDC
; lib_deps = ${env:esp32doit-devkit-v1.lib_deps}
; 			${common:bldc.lib_deps}
; lib_archive = false #required for SimpleFOC
